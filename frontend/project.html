<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxAI Studio</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Tone.js: client-side audio synthesis. No AI, no API calls. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">🎙</div>
      VoxAI Studio
    </a>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span id="nav-status" class="badge badge-draft">Draft</span>
      <a href="index.html" class="btn btn-ghost btn-sm">← Dashboard</a>
    </div>
  </div>
</nav>

<div class="workspace">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <div class="sidebar-title">Project</div>
      <input
        id="project-title-input"
        class="project-title-input"
        type="text"
        placeholder="Song title…"
      />
    </div>

    <div>
      <div class="sidebar-title">Details</div>
      <div id="project-meta"></div>
    </div>

    <div>
      <div class="sidebar-title">Progress</div>
      <div id="project-progress" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <button id="export-btn" class="btn btn-primary btn-sm" disabled>
        ⬇ Download Mix
      </button>
      <button id="share-btn" class="btn btn-secondary btn-sm" disabled>
        🔗 Copy Share Link
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main-content">
    <!-- Tab nav -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="lyrics">
        <span class="tab-indicator" id="ind-lyrics"></span> Lyrics
      </button>
      <button class="tab-btn" data-tab="beat">
        <span class="tab-indicator" id="ind-beat"></span> Beat
      </button>
      <button class="tab-btn" data-tab="melody">
        <span class="tab-indicator" id="ind-melody"></span> Melody
      </button>
      <button class="tab-btn" data-tab="vocals">
        <span class="tab-indicator" id="ind-vocals"></span> Vocals
      </button>
      <button class="tab-btn" data-tab="instruments">
        <span class="tab-indicator" id="ind-instruments"></span> Instruments
      </button>
      <button class="tab-btn" data-tab="mix">
        <span class="tab-indicator" id="ind-mix"></span> Mix
      </button>
    </div>

    <!-- Tab panes -->
    <div id="tab-lyrics" class="tab-pane active"></div>
    <div id="tab-beat" class="tab-pane"></div>
    <div id="tab-melody" class="tab-pane"></div>
    <div id="tab-vocals" class="tab-pane"></div>
    <div id="tab-instruments" class="tab-pane"></div>
    <div id="tab-mix" class="tab-pane"></div>
  </div>
</div>

<div id="toast-container"></div>

<script type="module" src="js/project.js"></script>
</body>
</html>
